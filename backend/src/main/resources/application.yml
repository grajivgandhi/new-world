spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/leadrelay}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${PORT:8080}
