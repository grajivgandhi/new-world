# SupportOS deployment foundation.
# Chatwoot provides the support engine; SupportOS is the branded product/service layer.
# Before production, pin the Chatwoot image to an exact tested version/digest and maintain
# the applicable upstream notices and license files.
services:
  chatwoot-rails:
    image: chatwoot/chatwoot:latest
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - storage_data:/app/storage
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: unless-stopped

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  storage_data:
  postgres_data:
  redis_data:
